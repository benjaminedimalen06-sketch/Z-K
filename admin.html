<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Z-K</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; min-height: 100vh; }
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px; border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(10,10,10,0.9); backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { color: #00ff88; font-size: 22px; font-weight: 900; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a, .nav-links button {
      color: #ccc; text-decoration: none; padding: 8px 16px;
      border-radius: 8px; font-size: 13px; background: none;
      border: none; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links button:hover { background: #1a1a1a; color: #00ff88; }
    .container { max-width: 1300px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    h1 span { color: #ffc832; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat {
      background: #111; border: 1px solid #1a1a1a; border-radius: 12px;
      padding: 20px; position: relative; overflow: hidden;
    }
    .stat::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: linear-gradient(90deg, #00ff88, #00cc6a);
    }
    .stat-label { color: #666; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { color: #00ff88; font-size: 32px; font-weight: 900; }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .tab {
      padding: 12px 24px; background: none; border: none;
      color: #666; cursor: pointer; font-size: 14px;
      font-family: inherit; font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all 0.2s;
    }
    .tab.active { color: #00ff88; border-bottom-color: #00ff88; }
    .tab:hover:not(.active) { color: #aaa; }
    .content-box {
      background: #111; border: 1px solid #1a1a1a;
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 14px 16px; text-align: left;
      border-bottom: 1px solid #1a1a1a; font-size: 13px;
    }
    th {
      background: #0d0d0d; color: #888; font-weight: 600;
      text-transform: uppercase; font-size: 11px; letter-spacing: 1px;
    }
    td { color: #ccc; }
    tr:hover td { background: #161616; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: bold; text-transform: uppercase;
    }
    .badge-owner { background: rgba(255, 200, 50, 0.15); color: #ffc832; border: 1px solid rgba(255, 200, 50, 0.3); }
    .badge-user { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .badge-public { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
    .badge-whitelist { background: rgba(255, 68, 68, 0.15); color: #ff6666; }
    .code {
      font-family: 'Consolas', monospace; color: #00ff88;
      font-size: 12px; background: #0a0a0a;
      padding: 2px 8px; border-radius: 4px;
    }
    .action-btn {
      background: #1a1a1a; border: 1px solid #333; color: #ccc;
      padding: 5px 10px; border-radius: 6px; cursor: pointer;
      font-size: 11px; font-family: inherit; transition: all 0.2s;
      margin-right: 4px;
    }
    .action-btn:hover { background: #222; color: #fff; }
    .action-btn.danger { color: #ff6666; border-color: #ff4444; }
    .action-btn.danger:hover { background: #ff4444; color: #fff; }
    .action-btn.promote { color: #ffc832; border-color: #ffc832; }
    .action-btn.promote:hover { background: #ffc832; color: #0a0a0a; }
    .empty { text-align: center; padding: 60px 20px; color: #666; }
    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: #00ff88; color: #0a0a0a;
      padding: 14px 24px; border-radius: 10px;
      font-weight: bold; font-size: 14px;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s; pointer-events: none; z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #ff4444; color: #fff; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">Z-K <span style="color:#ffc832;font-size:12px;margin-left:8px;">👑 ADMIN</span></div>
    <div class="nav-links">
      <a href="/dashboard.html">← Dashboard</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Admin <span>Panel</span></h1>
    <p class="subtitle">Owner-only access — Manage users and scripts</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Users</div>
        <div class="stat-value" id="totalUsers">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Scripts</div>
        <div class="stat-value" id="totalScripts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Whitelist Scripts</div>
        <div class="stat-value" id="whitelistScripts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Owners</div>
        <div class="stat-value" id="totalOwners">0</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('users')">👥 Users</button>
      <button class="tab" onclick="showTab('scripts')">📜 Scripts</button>
    </div>

    <div class="content-box">
      <div id="content"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const token = localStorage.getItem('zk_token');
    const user = JSON.parse(localStorage.getItem('zk_user') || 'null');

    if (!token || !user) window.location.href = '/';
    if (user.role !== 'owner') {
      alert('❌ Owner only!');
      window.location.href = '/dashboard.html';
    }

    let currentTab = 'users';
    let allUsers = [];
    let allScripts = [];

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('zk_token');
      localStorage.removeItem('zk_user');
      window.location.href = '/';
    });

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderContent();
    }

    async function loadData() {
      try {
        const [usersRes, scriptsRes] = await Promise.all([
          fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } }),
          fetch('/api/admin/scripts', { headers: { 'Authorization': 'Bearer ' + token } })
        ]);

        const usersData = await usersRes.json();
        const scriptsData = await scriptsRes.json();

        if (usersData.error) throw new Error(usersData.error);
        if (scriptsData.error) throw new Error(scriptsData.error);

        allUsers = usersData.users || [];
        allScripts = scriptsData.scripts || [];

        document.getElementById('totalUsers').textContent = allUsers.length;
        document.getElementById('totalScripts').textContent = allScripts.length;
        document.getElementById('whitelistScripts').textContent = allScripts.filter(s => s.access_type === 'whitelist').length;
        document.getElementById('totalOwners').textContent = allUsers.filter(u => u.role === 'owner').length;

        renderContent();
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="empty">❌ ${err.message}</div>`;
      }
    }

    function renderContent() {
      if (currentTab === 'users') renderUsers();
      else renderScripts();
    }

    function renderUsers() {
      if (allUsers.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty">No users</div>';
        return;
      }
      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Gmail</th>
              <th>Age</th>
              <th>Role</th>
              <th>Scripts</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${allUsers.map(u => `
              <tr>
                <td><strong>${escapeHtml(u.name)}</strong></td>
                <td>${escapeHtml(u.gmail)}</td>
                <td>${u.age}</td>
                <td><span class="badge ${u.role === 'owner' ? 'badge-owner' : 'badge-user'}">${u.role === 'owner' ? '👑 Owner' : '👤 User'}</span></td>
                <td>${u.script_count || 0}</td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td>
                  ${u.id === user.id ? '<span style="color:#666;font-size:11px;">You</span>' : `
                    <button class="action-btn ${u.role === 'owner' ? '' : 'promote'}" onclick="toggleRole('${u.id}', '${u.role}')">
                      ${u.role === 'owner' ? '⬇️ Demote' : '⬆️ Promote'}
                    </button>
                    <button class="action-btn danger" onclick="deleteUser('${u.id}', '${escapeHtml(u.name)}')">🗑️ Delete</button>
                  `}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderScripts() {
      if (allScripts.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty">No scripts</div>';
        return;
      }
      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Owner</th>
              <th>Access</th>
              <th>Public Link</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody>
            ${allScripts.map(s => `
              <tr>
                <td><strong>${escapeHtml(s.title)}</strong></td>
                <td>${escapeHtml(s.owner_name)} <span style="color:#666;font-size:11px;">(${escapeHtml(s.owner_gmail)})</span></td>
                <td><span class="badge ${s.access_type === 'whitelist' ? 'badge-whitelist' : 'badge-public'}">
                  ${s.access_type === 'whitelist' ? '🔒 Whitelist' : '🌐 Public'}
                </span></td>
                <td><span class="code">${s.public_link}</span></td>
                <td>${new Date(s.created_at).toLocaleDateString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    async function toggleRole(userId, currentRole) {
      const newRole = currentRole === 'owner' ? 'user' : 'owner';
      if (!confirm(`Change role to ${newRole.toUpperCase()}?`)) return;

      try {
        const res = await fetch('/api/admin/set-role', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ userId, role: newRole })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ Role updated!');
          loadData();
        } else {
          showToast('❌ ' + data.error, true);
        }
      } catch (err) {
        showToast('❌ ' + err.message, true);
      }
    }

    async function deleteUser(userId, name) {
      if (!confirm(`Delete user "${name}"? Lahat ng scripts niya ay mabubura rin.`)) return;

      try {
        const res = await fetch('/api/admin/delete-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ User deleted!');
          loadData();
        } else {
          showToast('❌ ' + data.error, true);
        }
      } catch (err) {
        showToast('❌ ' + err.message, true);
      }
    }

    loadData();
  </script>
</body>
</html>
