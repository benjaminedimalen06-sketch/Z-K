<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raw — Z-K</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(15, 15, 15, 0.95));
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 80px rgba(0, 255, 136, 0.1);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #0a0a0a;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
      letter-spacing: -1px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .section {
      margin-bottom: 24px;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .badge-count {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
    }
    .code-box {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #00ff88;
      word-break: break-all;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.3s;
    }
    .code-box:hover {
      border-color: #00ff88;
    }
    .code-box.warn {
      color: #ff6666;
      border-color: rgba(255, 68, 68, 0.3);
    }
    .code-box.warn:hover {
      border-color: #ff4444;
    }
    .code-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-icon-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .copy-icon-btn:hover {
      background: #00ff88;
      color: #0a0a0a;
      border-color: #00ff88;
      transform: scale(1.05);
    }
    .copy-icon-btn.copied {
      background: #00ff88;
      color: #0a0a0a;
      border-color: #00ff88;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 22px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      flex: 1;
      min-width: 140px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
    }
    .btn-secondary {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
    }
    .btn-secondary:hover {
      border-color: #00ff88;
      color: #00ff88;
    }
    .info-note {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
    }
    .info-note strong {
      color: #00ff88;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #444;
      font-size: 11px;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #00ff88;
      color: #0a0a0a;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.error {
      background: #ff4444;
      color: #fff;
      box-shadow: 0 10px 40px rgba(255, 68, 68, 0.4);
    }
    .loading-text {
      text-align: center;
      color: #666;
      font-size: 14px;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">Z-K</div>
    </div>
    <h1>Z-K</h1>
    <p class="subtitle">Raw Script Viewer</p>

    <div id="content">
      <div class="loading-text">⏳ Loading script info...</div>
    </div>

    <div class="actions" style="display:none;" id="actions">
      <a href="/dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
    </div>

    <div class="footer" id="footer" style="display:none;">
      Protected by <a href="/" style="color:#00ff88;text-decoration:none;">Z-K</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const scriptId = params.get('id');

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyText(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Copied!');
        const original = btnElement.innerHTML;
        btnElement.innerHTML = '✅';
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerHTML = original;
          btnElement.classList.remove('copied');
        }, 1500);
      }).catch(() => {
        showToast('❌ Failed to copy', true);
      });
    }

    async function loadRawInfo() {
      const content = document.getElementById('content');
      const actions = document.getElementById('actions');
      const footer = document.getElementById('footer');

      if (!scriptId) {
        content.innerHTML = `
          <div class="info-note" style="border-color: rgba(255, 68, 68, 0.3); background: rgba(255, 68, 68, 0.05); color: #ff8888;">
            ❌ <strong style="color:#ff6666;">Invalid Link</strong><br>
            Kulang ang script ID sa URL. Siguraduhing may <code style="color:#ff6666;">?id=xxx</code> sa dulo ng link.
          </div>
        `;
        actions.style.display = 'flex';
        footer.style.display = 'block';
        return;
      }

      const baseUrl = window.location.origin;
      const rawUrl = `${baseUrl}/api/raw?id=${scriptId}`;
      const getScriptUrl = `${baseUrl}/api/get-script?id=${scriptId}`;
      const loadstringCode = `loadstring(game:HttpGet("${rawUrl}"))()`;

      content.innerHTML = `
        <div class="info-note">
          <strong>💡 Info:</strong> Ang page na ito ay para sa pag-verify ng script protection. Ang totoong Lua code ay HINDI makikita dito — gagana lang ito sa Roblox Executor.
        </div>

        <div class="section">
          <div class="section-label">
            🎯 Loadstring Code
            <span class="badge-count">para sa Executor</span>
          </div>
          <div class="code-box">
            <span class="code-text">${escapeHtml(loadstringCode)}</span>
            <button class="copy-icon-btn" onclick="copyText('${escapeJs(loadstringCode)}', this)">📋</button>
          </div>
        </div>

        <div class="section">
          <div class="section-label">
            🌐 Raw URL
            <span class="badge-count">direct link</span>
          </div>
          <div class="code-box">
            <span class="code-text">${escapeHtml(rawUrl)}</span>
            <button class="copy-icon-btn" onclick="copyText('${escapeJs(rawUrl)}', this)">📋</button>
          </div>
        </div>

        <div class="section">
          <div class="section-label">
            🔒 Get-Script Endpoint
            <span class="badge-count">protected</span>
          </div>
          <div class="code-box warn">
            <span class="code-text">${escapeHtml(getScriptUrl)}</span>
            <button class="copy-icon-btn" onclick="copyText('${escapeJs(getScriptUrl)}', this)">📋</button>
          </div>
        </div>

        <div class="section">
          <div class="section-label">
            🆔 Script ID
          </div>
          <div class="code-box">
            <span class="code-text">${escapeHtml(scriptId)}</span>
            <button class="copy-icon-btn" onclick="copyText('${escapeJs(scriptId)}', this)">📋</button>
          </div>
        </div>
      `;

      actions.style.display = 'flex';
      footer.style.display = 'block';
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function escapeJs(text) {
      return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    loadRawInfo();
  </script>
</body>
</html>
