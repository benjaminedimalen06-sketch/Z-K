<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-K — Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .orb-1 { width: 400px; height: 400px; background: #00ff88; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #00cc6a; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; }
    @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(100px, 100px); } }
    @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -60px); } }
    .container {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 80px rgba(0, 255, 136, 0.1);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #0a0a0a;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
      animation: logoPulse 3s ease-in-out infinite;
      letter-spacing: -1px;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5); }
      50% { box-shadow: 0 0 60px rgba(0, 255, 136, 0.8); }
    }
    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .error {
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05));
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff8888;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      animation: shake 0.5s ease;
    }
    .error.show { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
      background: rgba(0, 0, 0, 0.7);
    }
    input::placeholder { color: #444; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 1px;
      font-family: inherit;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
    }
    button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
    .link { text-align: center; margin-top: 24px; color: #666; font-size: 13px; }
    .link a { color: #00ff88; text-decoration: none; font-weight: 700; transition: all 0.3s; }
    .link a:hover { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #444;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon">Z-K</div>
    </div>
    <h1>Z-K</h1>
    <p class="subtitle">Script Protection System</p>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <label>Name</label>
      <input type="text" id="name" required placeholder="Enter your name" autocomplete="username">

      <label>Password</label>
      <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">

      <button type="submit" id="submitBtn">🔐 Login</button>
    </form>

    <p class="link">Don't have an account? <a href="/register.html">Register</a></p>

    <div class="footer">
      © 2026 Z-K — All rights reserved
    </div>
  </div>

  <script>
    if (localStorage.getItem('zk_token')) {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = '⏳ Loading...';
      errorBox.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('zk_token', data.token);
        localStorage.setItem('zk_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = '❌ ' + err.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '🔐 Login';
      }
    });
  </script>
</body>
</html>
