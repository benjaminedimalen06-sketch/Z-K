<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-K — Register</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .orb-1 { width: 400px; height: 400px; background: #00ff88; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #00cc6a; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; }
    @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(100px, 100px); } }
    @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -60px); } }
    .container {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 80px rgba(0, 255, 136, 0.1);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #0a0a0a;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
      animation: logoPulse 3s ease-in-out infinite;
      letter-spacing: -1px;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5); }
      50% { box-shadow: 0 0 60px rgba(0, 255, 136, 0.8); }
    }
    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .error, .success, .info {
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      line-height: 1.5;
    }
    .error {
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05));
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff8888;
    }
    .error.show { display: block; animation: shake 0.5s ease; }
    .success {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    .success.show { display: block; animation: fadeUp 0.5s ease; }
    .info {
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.15), rgba(0, 170, 255, 0.05));
      border: 1px solid rgba(0, 170, 255, 0.3);
      color: #66ccff;
    }
    .info.show { display: block; animation: fadeUp 0.5s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
      background: rgba(0, 0, 0, 0.7);
    }
    input::placeholder { color: #444; }
    .hint { color: #555; font-size: 11px; margin-top: -14px; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 1px;
      font-family: inherit;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
    }
    button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
    .link { text-align: center; margin-top: 24px; color: #666; font-size: 13px; }
    .link a { color: #00ff88; text-decoration: none; font-weight: 700; }
    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #444;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon">Z-K</div>
    </div>
    <h1>Z-K</h1>
    <p class="subtitle">Create your account</p>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <div class="info" id="info"></div>

    <form id="registerForm">
      <label>Name</label>
      <input type="text" id="name" required minlength="3" placeholder="Enter your name" autocomplete="name" value="Zyrox">

      <label>Gmail</label>
      <input type="email" id="gmail" required placeholder="Enter your Gmail" autocomplete="email" value="benjaminedimalen06@gmail.com">

      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="Enter your password" autocomplete="new-password">
      <p class="hint">Minimum 6 characters</p>

      <label>Age</label>
      <input type="number" id="age" required min="10" max="100" placeholder="Enter your age" value="21">

      <button type="submit" id="submitBtn">✨ Register</button>
    </form>

    <p class="link">Already have an account? <a href="/">Login</a></p>

    <div class="footer">
      © 2026 Z-K — All rights reserved
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function warmupServer() {
      try {
        const info = document.getElementById('info');
        info.textContent = '⏳ Waking up server...';
        info.classList.add('show');
        
        await fetch(API_BASE + '/api/list', { 
          method: 'GET',
          headers: { 'Cache-Control': 'no-cache' }
        });
        
        info.classList.remove('show');
      } catch (err) {
        document.getElementById('info').classList.remove('show');
      }
    }

    async function fetchWithRetry(url, options, retries = 3) {
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, options);
          return res;
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(r => setTimeout(r, 3000));
        }
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');
      const infoBox = document.getElementById('info');
      
      btn.disabled = true;
      btn.textContent = '⏳ Creating...';
      errorBox.classList.remove('show');
      successBox.classList.remove('show');
      infoBox.classList.remove('show');

      const payload = {
        name: document.getElementById('name').value.trim(),
        gmail: document.getElementById('gmail').value.trim(),
        password: document.getElementById('password').value,
        age: parseInt(document.getElementById('age').value)
      };

      try {
        infoBox.textContent = '⏳ Connecting to server...';
        infoBox.classList.add('show');

        const res = await fetchWithRetry(API_BASE + '/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }, 3);

        infoBox.classList.remove('show');

        // I-check kung JSON ang response
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Server error: hindi JSON ang response. I-check ang Render logs.');
        }

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Registration failed');
        }

        successBox.textContent = '✅ Account created! Redirecting to login...';
        successBox.classList.add('show');
        localStorage.setItem('zk_last_name', payload.name);
        setTimeout(() => window.location.href = '/', 1500);
      } catch (err) {
        infoBox.classList.remove('show');
        let errorMsg = err.message;
        
        if (err.message === 'fetch failed' || err.message.includes('Failed to fetch')) {
          errorMsg = 'Hindi maka-connect sa server. Nag-sleep ang Render server (free tier). Hintayin 30-60 seconds at i-try ulit.';
        }
        
        errorBox.textContent = '❌ ' + errorMsg;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '✨ Register';
      }
    });

    window.addEventListener('load', () => {
      warmupServer();
    });
  </script>
</body>
</html>
