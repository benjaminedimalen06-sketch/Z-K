<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-K — Register</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .orb-1 { width: 400px; height: 400px; background: #00ff88; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #00cc6a; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; }
    @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(100px, 100px); } }
    @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -60px); } }
    .container {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 80px rgba(0, 255, 136, 0.1);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #0a0a0a;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
      animation: logoPulse 3s ease-in-out infinite;
      letter-spacing: -1px;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5); }
      50% { box-shadow: 0 0 60px rgba(0, 255, 136, 0.8); }
    }
    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .error, .success, .info {
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      line-height: 1.5;
    }
    .error {
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05));
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff8888;
    }
    .error.show { display: block; animation: shake 0.5s ease; }
    .success {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    .success.show { display: block; animation: fadeUp 0.5s ease; }
    .info {
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.15), rgba(0, 170, 255, 0.05));
      border: 1px solid rgba(0, 170, 255, 0.3);
      color: #66ccff;
    }
    .info.show { display: block; animation: fadeUp 0.5s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
      background: rgba(0, 0, 0, 0.7);
    }
    input::placeholder { color: #444; }
    .hint { color: #555; font-size: 11px; margin-top: -14px; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 1px;
      font-family: inherit;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
    }
    button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
    .link { text-align: center; margin-top: 24px; color: #666; font-size: 13px; }
    .link a { color: #00ff88; text-decoration: none; font-weight: 700; }
    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #444;
      font-size: 11px;
    }
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 60px; height: 60px;
      border: 4px solid rgba(0, 255, 136, 0.2);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #00ff88;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .loading-subtext {
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">CREATING ACCOUNT...</div>
    <div class="loading-subtext" id="loadingSubtext">Please wait</div>
  </div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon">Z-K</div>
    </div>
    <h1>Z-K</h1>
    <p class="subtitle">Create your account</p>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <div class="info" id="info"></div>

    <form id="registerForm" autocomplete="off">
      <label>Name</label>
      <input type="text" id="name" required minlength="3" placeholder="Enter your name" autocomplete="off">

      <label>Gmail</label>
      <input type="email" id="gmail" required placeholder="Enter your Gmail" autocomplete="off">

      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="Enter your password" autocomplete="new-password">
      <p class="hint">Minimum 6 characters — ito rin ang gagamitin mo sa login</p>

      <label>Age</label>
      <input type="number" id="age" required min="10" max="100" placeholder="Enter your age" autocomplete="off">

      <button type="submit" id="submitBtn">✨ Register</button>
    </form>

    <p class="link">Already have an account? <a href="/">Login</a></p>

    <div class="footer">
      © 2026 Z-K — All rights reserved
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // AUTOMATIC WARMUP — wake up Render server
    fetch(API_BASE + '/api/list').catch(() => {});

    // Save last name
    const lastName = localStorage.getItem('zk_last_name');
    if (lastName) {
      document.getElementById('name').value = lastName;
    }

    function showError(msg) {
      const errorBox = document.getElementById('error');
      errorBox.textContent = '❌ ' + msg;
      errorBox.classList.add('show');
      setTimeout(() => errorBox.classList.remove('show'), 8000);
    }

    function showSuccess(msg) {
      const successBox = document.getElementById('success');
      successBox.textContent = '✅ ' + msg;
      successBox.classList.add('show');
    }

    function showLoading(text, subtext) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingSubtext').textContent = subtext || '';
      document.getElementById('loadingOverlay').classList.add('show');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }

    // Custom fetch with timeout
    async function fetchWithTimeout(url, options = {}, timeoutMs = 60000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      
      try {
        const res = await fetch(url, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return res;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      
      const name = document.getElementById('name').value.trim();
      const gmail = document.getElementById('gmail').value.trim();
      const password = document.getElementById('password').value;
      const age = parseInt(document.getElementById('age').value);

      // Client-side validation
      if (name.length < 3) return showError('Name must be at least 3 characters');
      if (!gmail.includes('@')) return showError('Invalid Gmail');
      if (password.length < 6) return showError('Password must be at least 6 characters');
      if (age < 10 || age > 100) return showError('Age must be 10-100');

      btn.disabled = true;
      btn.textContent = '⏳ Creating...';
      
      showLoading('CREATING ACCOUNT...', 'Please wait');

      try {
        // Add cache-busting parameter
        const url = API_BASE + '/api/register?t=' + Date.now();
        
        const res = await fetchWithTimeout(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ name, gmail, password, age })
        }, 60000);

        // Check kung JSON
        const contentType = res.headers.get('content-type') || '';
        
        if (!contentType.includes('application/json')) {
          const text = await res.text();
          console.log('Non-JSON response:', text.substring(0, 200));
          hideLoading();
          throw new Error('Server error (' + res.status + '): hindi JSON ang response');
        }

        const data = await res.json();
        console.log('Response:', data);

        if (!res.ok || !data.success) {
          hideLoading();
          throw new Error(data.error || 'Registration failed');
        }

        // Save name for login page
        localStorage.setItem('zk_last_name', name);

        showLoading('ACCOUNT CREATED!', 'Redirecting to login...');
        showSuccess('Account created successfully!');
        btn.textContent = '✅ Success!';

        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (err) {
        hideLoading();
        console.error('Register error:', err);
        
        let errorMsg = err.message;
        
        if (err.name === 'AbortError') {
          errorMsg = 'Request timeout (60s). Nag-sleep ang Render server. Hintayin 30-60s at i-try ulit.';
        } else if (err.message === 'fetch failed' || err.message.includes('Failed to fetch')) {
          errorMsg = 'Hindi maka-connect sa server. Nag-sleep ang Render server (free tier). Hintayin 30-60s at i-try ulit.';
        }
        
        showError(errorMsg);
        btn.disabled = false;
        btn.textContent = '✨ Register';
      }
    });
  </script>
</body>
</html>
