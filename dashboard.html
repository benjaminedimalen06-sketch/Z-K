<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Z-K</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; min-height: 100vh; }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 255, 136, 0.03) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { color: #00ff88; font-size: 22px; font-weight: 900; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a, .nav-links button {
      color: #ccc; text-decoration: none; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; background: none; border: none; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links button:hover { background: #1a1a1a; color: #00ff88; }
    .nav-links button.primary {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a; font-weight: bold;
    }
    .nav-links button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3); }
    .nav-links a.admin-link { color: #ffc832; }
    .nav-links a.admin-link:hover { background: rgba(255, 200, 50, 0.1); }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; position: relative; z-index: 1; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    h1 span { color: #00ff88; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat {
      background: #111; border: 1px solid #1a1a1a; border-radius: 12px;
      padding: 20px; position: relative; overflow: hidden; transition: all 0.2s;
    }
    .stat:hover { border-color: #333; }
    .stat::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #00ff88, #00cc6a);
    }
    .stat-label { color: #666; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { color: #00ff88; font-size: 28px; font-weight: 900; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .btn {
      padding: 12px 22px; border-radius: 10px; border: none; font-size: 14px;
      font-weight: bold; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3); }
    .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #333; }
    .btn-secondary:hover { border-color: #00ff88; color: #00ff88; }

    .script-card {
      background: #111; border: 1px solid #1a1a1a; border-radius: 12px;
      padding: 20px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; transition: all 0.2s;
    }
    .script-card:hover { border-color: #333; background: #131313; }
    .script-info { flex: 1; min-width: 220px; }
    .script-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .script-meta {
      color: #666; font-size: 12px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-public { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .badge-whitelist { background: rgba(255, 68, 68, 0.15); color: #ff6666; border: 1px solid rgba(255, 68, 68, 0.3); }
    .script-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .icon-btn {
      background: #1a1a1a; border: 1px solid #333; color: #ccc;
      min-width: 40px; height: 40px; padding: 0 12px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; transition: all 0.2s; font-family: inherit;
    }
    .icon-btn:hover { background: #222; color: #00ff88; border-color: #00ff88; }
    .icon-btn.danger:hover { background: #ff4444; color: #fff; border-color: #ff4444; }

    .empty-state {
      text-align: center; padding: 80px 20px; color: #666;
      background: #111; border: 1px solid #1a1a1a; border-radius: 12px;
    }
    .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { color: #888; margin-bottom: 8px; font-size: 18px; }
    .empty-state p { font-size: 13px; margin-bottom: 20px; }

    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: #00ff88; color: #0a0a0a;
      padding: 14px 24px; border-radius: 10px;
      font-weight: bold; font-size: 14px;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s; pointer-events: none; z-index: 9999;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.4);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #ff4444; color: #fff; box-shadow: 0 10px 40px rgba(255, 68, 68, 0.4); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #111; border: 1px solid #222; border-radius: 16px;
      padding: 32px; width: 100%; max-width: 600px;
      animation: fadeUp 0.3s ease;
    }
    .modal h2 { margin-bottom: 12px; color: #00ff88; }
    .modal p { color: #888; font-size: 13px; margin-bottom: 20px; }
    .loadstring-box {
      background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 10px;
      padding: 16px; font-family: 'Consolas', monospace;
      font-size: 12px; color: #00ff88; word-break: break-all;
      line-height: 1.6; margin-bottom: 16px;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; justify-content: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">Z-K</div>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/editor.html" class="primary">+ New Script</a>
      <a href="/admin.html" class="admin-link" id="adminLink" style="display:none;">👑 Admin</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Welcome back, <span id="userName">User</span>! 👋</h1>
    <p class="subtitle">Manage your protected Lua scripts</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Scripts</div>
        <div class="stat-value" id="totalScripts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Public</div>
        <div class="stat-value" id="publicScripts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Whitelist Only</div>
        <div class="stat-value" id="whitelistScripts">0</div>
      </div>
    </div>

    <div class="toolbar">
      <a href="/editor.html" class="btn btn-primary">+ Create New Script</a>
      <button class="btn btn-secondary" onclick="loadScripts()">🔄 Refresh</button>
    </div>

    <div id="scriptsList"></div>
  </div>

  <div class="modal-overlay" id="loadstringModal">
    <div class="modal">
      <h2>🎯 Loadstring Code</h2>
      <p>I-paste ito sa iyong Roblox executor (Delta, Solara, Xeno, etc.)</p>
      <div class="loadstring-box" id="loadstringText"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="copyLoadstring()">📋 Copy</button>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const token = localStorage.getItem('zk_token');
    const user = JSON.parse(localStorage.getItem('zk_user') || 'null');

    if (!token || !user) {
      window.location.href = '/';
    }

    document.getElementById('userName').textContent = user.name || 'User';

    if (user.role === 'owner') {
      document.getElementById('adminLink').style.display = 'inline-block';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('zk_token');
      localStorage.removeItem('zk_user');
      window.location.href = '/';
    });

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    async function loadScripts() {
      const list = document.getElementById('scriptsList');
      list.innerHTML = '<div class="empty-state"><h3>Loading...</h3></div>';

      try {
        const res = await fetch('/api/list', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        if (!data.scripts) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="icon">📝</div>
              <h3>Wala ka pang script</h3>
              <p>Create your first script para makapagsimula.</p>
              <a href="/editor.html" class="btn btn-primary">+ Create Script</a>
            </div>
          `;
          return;
        }

        const scripts = data.scripts;

        document.getElementById('totalScripts').textContent = scripts.length;
        document.getElementById('publicScripts').textContent = scripts.filter(s => s.access_type === 'public' || !s.access_type).length;
        document.getElementById('whitelistScripts').textContent = scripts.filter(s => s.access_type === 'whitelist').length;

        if (scripts.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="icon">📝</div>
              <h3>Wala ka pang script</h3>
              <p>Create your first script para makapagsimula.</p>
              <a href="/editor.html" class="btn btn-primary">+ Create Script</a>
            </div>
          `;
          return;
        }

        list.innerHTML = scripts.map(s => `
          <div class="script-card">
            <div class="script-info">
              <div class="script-title">${escapeHtml(s.title)}</div>
              <div class="script-meta">
                <span class="badge ${s.access_type === 'whitelist' ? 'badge-whitelist' : 'badge-public'}">
                  ${s.access_type === 'whitelist' ? '🔒 Whitelist' : '🌐 Public'}
                </span>
                <span>📅 ${new Date(s.created_at).toLocaleDateString()}</span>
                <span style="font-family:'Consolas',monospace;color:#00ff88;font-size:11px;background:#0a0a0a;padding:2px 8px;border-radius:4px;">${s.public_link}</span>
              </div>
            </div>
            <div class="script-actions">
              <button class="icon-btn" onclick="showLoadstring('${s.public_link}')" title="Get Loadstring">📋 Loadstring</button>
              <button class="icon-btn" onclick="window.open('/api/raw?id=${s.public_link}', '_blank')" title="View">👁️</button>
              <button class="icon-btn" onclick="window.location.href='/editor.html?id=${s.id}'" title="Edit">✏️</button>
              <button class="icon-btn danger" onclick="deleteScript('${s.id}', '${escapeHtml(s.title).replace(/'/g, "\\'")}')" title="Delete">🗑️</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty-state"><h3>❌ Error</h3><p>${err.message}</p></div>`;
      }
    }

    function showLoadstring(link) {
      const baseUrl = window.location.origin;
      const loadstring = `loadstring(game:HttpGet("${baseUrl}/api/raw?id=${link}"))()`;
      document.getElementById('loadstringText').textContent = loadstring;
      document.getElementById('loadstringModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('loadstringModal').classList.remove('show');
    }

    document.getElementById('loadstringModal').addEventListener('click', (e) => {
      if (e.target.id === 'loadstringModal') closeModal();
    });

    function copyLoadstring() {
      const text = document.getElementById('loadstringText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Loadstring copied!');
        setTimeout(closeModal, 800);
      }).catch(() => {
        showToast('❌ Failed to copy', true);
      });
    }

    async function deleteScript(id, title) {
      if (!confirm(`Delete "${title}"? Hindi na ito maibabalik.`)) return;

      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ id })
        });
        const data = await res.json();

        if (data.success) {
          showToast('✅ Deleted!');
          loadScripts();
        } else {
          showToast('❌ ' + (data.error || 'Failed'), true);
        }
      } catch (err) {
        showToast('❌ ' + err.message, true);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    loadScripts();
  </script>
</body>
</html>
